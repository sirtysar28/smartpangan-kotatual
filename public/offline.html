<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — Pangan Cerdas (Panca) Maryadat Kota Tual</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 40%, #312e81 70%, #4338ca 100%);
            background-size: 200% 200%; animation: gradient-shift 8s ease infinite;
            color: #fff; padding: 1.5rem; text-align: center;
        }
        @keyframes gradient-shift { 0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%} }
        @keyframes float { 0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)} }
        .offline-card {
            max-width: 420px; width: 100%; background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 24px; padding: 3rem 2rem;
            box-shadow: 0 25px 80px rgba(0,0,0,0.35);
        }
        .offline-icon {
            width: 90px; height: 90px; margin: 0 auto 1.5rem; border-radius: 24px;
            background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center;
            animation: float 3s ease-in-out infinite;
        }
        .offline-icon svg { width: 44px; height: 44px; stroke: #fbbf24; }
        h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: .6rem; }
        p { font-size: .9rem; color: rgba(255,255,255,0.7); line-height: 1.6; margin-bottom: 1.75rem; }
        .btn {
            display: inline-flex; align-items: center; gap: .5rem; text-decoration: none;
            background: linear-gradient(135deg, #6366f1, #0ea5e9); color: #fff; font-weight: 700;
            padding: .85rem 2rem; border-radius: 12px; border: none; cursor: pointer;
            font-size: .95rem; transition: transform .25s ease, box-shadow .25s ease;
            box-shadow: 0 8px 25px rgba(99,102,241,0.4);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(99,102,241,0.55); }
        .logo { width: 56px; height: 56px; border-radius: 14px; margin-bottom: 1rem; }
        footer { margin-top: 2rem; font-size: .7rem; color: rgba(255,255,255,0.4); }
        footer a { color: rgba(255,255,255,0.65); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="offline-card">
        <img src="/logo.png" alt="PANCA Kota Tual" class="logo">
        <div class="offline-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M8.288 15.038a5.25 5.25 0 017.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.75 19.5a.75.75 0 11-1.5 0 .75.75 0 011.5 0z"/>
            </svg>
        </div>
        <h1>Tidak Ada Koneksi Internet</h1>
        <p>Sepertinya Anda sedang offline. Periksa koneksi internet Anda lalu coba lagi. Halaman yang pernah dikunjungi tetap dapat diakses secara offline.</p>
        <a href="/" class="btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/>
            </svg>
            Coba Lagi
        </a>
        <footer>
            PANCA — Pangan Cerdas Maryadat Kota Tual<br>
            Developed by <a href="https://ciptakaryadigital.id/new">CV Cipta Karya Digital Indonesia</a>
        </footer>
    </div>
    <script>
        // Cek koneksi otomatis & reload saat kembali online
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
